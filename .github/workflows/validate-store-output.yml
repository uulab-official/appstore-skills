name: Validate store output

on:
  workflow_dispatch:
    inputs:
      output_path:
        description: "Repository-relative generated store output path"
        required: true
        default: "store-assets"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_store_output.py "${{ inputs.output_path }}"

