name: Annotate release report

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Annotate demo release report
        run: >-
          python scripts/annotate_release_report.py
          examples/demo-store-assets/release-report.md
          --github-actions
