    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <path fill="url(#cobalt)" d="M 64 200 C 42 178 38 132 48 85 C 58 42 94 25 137 34 C 178 43 207 75 214 112 C 217 128 207 139 195 141 C 184 143 177 135 173 123 C 166 97 150 79 130 73 C 106 67 88 79 81 102 C 74 127 78 152 94 169 C 110 185 132 188 155 180 L 173 208 C 135 224 93 222 64 200 Z"/>
  <path fill="#10172F" d="M 82 101 C 91 74 117 62 143 69 C 171 76 190 98 195 125 C 197 137 190 145 180 146 L 93 146 C 82 140 78 121 82 101 Z"/>
  <rect x="82" y="101" width="102" height="52" rx="26" fill="url(#coral)"/>
  <rect x="112" y="113" width="49" height="28" rx="14" fill="#FF9F94" opacity=".62"/>
  <rect x="174" y="116" width="31" height="20" rx="10" fill="url(#coral)"/>
</svg>
