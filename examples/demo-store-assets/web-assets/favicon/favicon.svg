<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Example App favicon</title>
  <desc id="desc">A layered cobalt portal holding a coral priority capsule.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#1B2B69"/>
      <stop offset="1" stop-color="#121A3A"/>
    </radialGradient>
    <linearGradient id="cobalt" x1="18%" y1="18%" x2="82%" y2="86%">
      <stop offset="0" stop-color="#7AA3FF"/>
      <stop offset=".28" stop-color="#315CFF"/>
      <stop offset="1" stop-color="#1436A3"/>
    </linearGradient>
    <radialGradient id="coral" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#FFB1A6"/>
      <stop offset=".3" stop-color="#FF786B"/>
      <stop offset="1" stop-color="#D9434A"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
