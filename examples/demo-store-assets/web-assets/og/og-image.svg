<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Example App — Keep important tasks visible.</title>
  <desc id="desc">A demo social preview for a fictional productivity app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F8FF"/>
      <stop offset="1" stop-color="#E9EEFF"/>
    </linearGradient>
    <radialGradient id="iconBg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#1B2B69"/>
      <stop offset="1" stop-color="#121A3A"/>
    </radialGradient>
    <linearGradient id="iconCobalt" x1="18%" y1="18%" x2="82%" y2="86%">
      <stop offset="0" stop-color="#7AA3FF"/>
      <stop offset=".28" stop-color="#315CFF"/>
      <stop offset="1" stop-color="#1436A3"/>
    </linearGradient>
    <radialGradient id="iconCoral" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#FFB1A6"/>
      <stop offset=".3" stop-color="#FF786B"/>
      <stop offset="1" stop-color="#D9434A"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17203A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="170" fill="#FF786B" opacity=".16"/>
  <circle cx="1040" cy="590" r="240" fill="#315CFF" opacity=".10"/>
  <g transform="translate(92 92)">
    <rect width="78" height="78" rx="22" fill="url(#iconBg)"/>
    <g transform="translate(7 7) scale(.25)">
      <path fill="url(#iconCobalt)" d="M 64 200 C 42 178 38 132 48 85 C 58 42 94 25 137 34 C 178 43 207 75 214 112 C 217 128 207 139 195 141 C 184 143 177 135 173 123 C 166 97 150 79 130 73 C 106 67 88 79 81 102 C 74 127 78 152 94 169 C 110 185 132 188 155 180 L 173 208 C 135 224 93 222 64 200 Z"/>
      <path fill="#10172F" d="M 82 101 C 91 74 117 62 143 69 C 171 76 190 98 195 125 C 197 137 190 145 180 146 L 93 146 C 82 140 78 121 82 101 Z"/>
      <rect x="82" y="101" width="102" height="52" rx="26" fill="url(#iconCoral)"/>
      <rect x="112" y="113" width="49" height="28" rx="14" fill="#FF9F94" opacity=".62"/>
      <rect x="174" y="116" width="31" height="20" rx="10" fill="url(#iconCoral)"/>
    </g>
  </g>
  <text x="92" y="238" fill="#315CFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2">EXAMPLE APP</text>
  <text x="92" y="326" fill="#17203A" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">Keep important</text>
  <text x="92" y="398" fill="#17203A" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">tasks visible.</text>
  <text x="96" y="456" fill="#52607D" font-family="Arial, Helvetica, sans-serif" font-size="26">Capture, organize, and finish everyday work.</text>
  <g transform="translate(874 220)" filter="url(#shadow)">
    <rect width="206" height="206" rx="54" fill="url(#iconBg)"/>
    <g transform="scale(.8046875)">
      <path fill="url(#iconCobalt)" d="M 64 200 C 42 178 38 132 48 85 C 58 42 94 25 137 34 C 178 43 207 75 214 112 C 217 128 207 139 195 141 C 184 143 177 135 173 123 C 166 97 150 79 130 73 C 106 67 88 79 81 102 C 74 127 78 152 94 169 C 110 185 132 188 155 180 L 173 208 C 135 224 93 222 64 200 Z"/>
      <path fill="#10172F" d="M 82 101 C 91 74 117 62 143 69 C 171 76 190 98 195 125 C 197 137 190 145 180 146 L 93 146 C 82 140 78 121 82 101 Z"/>
      <rect x="82" y="101" width="102" height="52" rx="26" fill="url(#iconCoral)"/>
      <rect x="112" y="113" width="49" height="28" rx="14" fill="#FF9F94" opacity=".62"/>
      <rect x="174" y="116" width="31" height="20" rx="10" fill="url(#iconCoral)"/>
    </g>
  </g>
  <text x="96" y="568" fill="#7B86A2" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">DEMO CONCEPT — NOT A PRODUCTION LISTING</text>
