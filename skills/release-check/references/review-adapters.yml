schema_version: 1
adapter_set:
  id: appstore-review-adapters-v1
  status: review
  mode: read-only
  execution: opt-in
  source_of_truth: release-report.md
adapters:
  - id: policy-review
    kind: policy
    status: blocked
    enabled_by_default: false
    evidence_path: evidence/policy-review.yml
    required_fields: [status, reviewer, scope, reviewed_at, evidence]
    allowed_statuses: [pending, pass, block, not_applicable]
    proves: A designated reviewer recorded the policy and claims review scope.
    side_effects: none
    required_checks: [file-exists, status, reviewer, timestamp, evidence]
  - id: accessibility-review
    kind: accessibility
    status: blocked
    enabled_by_default: false
    evidence_path: evidence/accessibility-review.yml
    required_fields: [status, reviewer, scope, reviewed_at, evidence]
    allowed_statuses: [pending, pass, block, not_applicable]
    proves: A designated reviewer recorded accessibility review scope and findings.
    side_effects: none
    required_checks: [file-exists, status, reviewer, timestamp, evidence]
  - id: privacy-review
    kind: privacy
    status: blocked
    enabled_by_default: false
    evidence_path: evidence/privacy-review.yml
    required_fields: [status, reviewer, scope, reviewed_at, evidence]
    allowed_statuses: [pending, pass, block, not_applicable]
    proves: A designated reviewer recorded data collection, disclosure, and privacy review scope.
    side_effects: none
    required_checks: [file-exists, status, reviewer, timestamp, evidence]
