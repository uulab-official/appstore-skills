schema_version: 1
provider_set:
  id: appstore-evidence-providers-v1
  status: review
  mode: read-only
  execution: opt-in
  source_of_truth: evidence-adapters.yml
  owner: repository
  selection: explicit
providers:
  - id: build-record
    kind: build
    status: review
    enabled_by_default: false
    evidence_path: evidence/build.yml
    required_fields: [revision, artifact, platform, inspected_at, source]
    proves: The inspected build identity and source revision are recorded without running a build.
    side_effects: none
    required_checks: [file-exists, required-fields, timestamp, revision-recorded]
  - id: project-facts
    kind: project
    status: review
    enabled_by_default: false
    evidence_path: evidence/project-facts.yml
    required_fields: [project_name, category, audience, features, source_paths, assumptions, private_data_screen, inspected_at, source]
    proves: Product facts and assumptions are separated and grounded in project-owned source paths without executing project commands.
    side_effects: none
    required_checks: [file-exists, required-fields, source-paths, facts-separated-from-assumptions, private-data-screen, timestamp]
  - id: simulator-source-captures
    kind: simulator
    status: blocked
    enabled_by_default: false
    evidence_path: evidence/captures.yml
    capture_root: screenshots/source
    required_fields: [path, platform, device_family, locale, captured_at, provenance]
    proves: Source images are real capture artifacts with named platform, device family, locale, and provenance.
    side_effects: none
    required_checks: [manifest-exists, paths-contained, unique-paths, image-signature, metadata, timestamp]
