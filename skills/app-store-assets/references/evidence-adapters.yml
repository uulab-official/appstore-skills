schema_version: 1
evidence_set:
  id: appstore-evidence-adapters-v1
  status: draft
  source_of_truth: brand-context.yml
adapters:
  - id: project-discovery
    kind: project
    status: review
    inputs: [README.md, app metadata, routes, theme tokens, existing assets]
    outputs: [brand-context.yml, evidence/project-facts.yml]
    proves: Product name, category, audience, features, visual decisions, and assumptions.
    required_checks: [source-paths, facts-separated-from-assumptions, private-data-screen]
  - id: build-evidence
    kind: build
    status: blocked
    inputs: [build configuration, package metadata, commit or release revision]
    outputs: [evidence/build.yml]
    proves: The inspected app build and source revision correspond to the asset run.
    required_checks: [build-revision, target-platform, reproducible-command, artifact-identity]
  - id: simulator-capture
    kind: simulator
    status: blocked
    inputs: [real iOS simulator, Android emulator, or supplied device captures]
    outputs: [screenshots/source/]
    proves: Store screenshots show real product UI at the named device family and locale.
    required_checks: [device-family, locale, capture-date, ui-fidelity, no-private-data]
  - id: release-system
    kind: release
    status: review
    inputs: [release-report.md, platform documentation, approvals, licenses]
    outputs: [QA.md, release-report.md]
    proves: The package's blockers, warnings, platform checks, and human approvals are explicit.
    required_checks: [current-docs, approval-state, rights-review, blocker-annotation]
